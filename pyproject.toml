[project]
name = "vi-fc"
version = "0.1.0"
description = "Gọi hàm (function calling) tiếng Việt trong xe: chưng cất từ LLM lớn sang Qwen3-1.7B chạy offline bằng GGUF"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Tiến Dương", email = "duongcodeai2@gmail.com" }]
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
# chạy GGUF trên CPU laptop
infer = ["llama-cpp-python>=0.3"]
# chỉ cài trên Colab (GPU T4), CI và laptop không cần
train = ["unsloth", "trl>=0.19", "transformers>=4.51", "peft", "datasets", "bitsandbytes"]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
