name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # không cài llama-cpp / unsloth: test chỉ chạy phần lõi (schema, safety, parse, datagen, metric)
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest -q
